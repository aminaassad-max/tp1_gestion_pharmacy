<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Categories</title>
</head>

<body>

<h1>Liste des Categories</h1>

<table border="1">

<tr>
    <th>ID</th>
    <th>Nom</th>
</tr>


<tr th:each="cat : ${categories}">

    <td th:text="${cat.id}"></td>
    <td th:text="${cat.nom}"></td>

</tr>


</table>

</body>
</html>
